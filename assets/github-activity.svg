<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Recent GitHub activity</title>
  <desc id="desc">This placeholder is replaced by automatically refreshed GitHub activity metrics after the workflow runs.</desc>
  <defs>
    <linearGradient id="bar-gradient" x1="0" y1="1" x2="0" y2="0">
      <stop class="bar-start" offset="0%"/>
      <stop class="bar-end" offset="100%"/>
    </linearGradient>
  </defs>
  <style>
    .surface { fill: #F5F5F7; }
    .primary { fill: #1D1D1F; }
    .secondary { fill: #6E6E73; }
    .bars { fill: url(#bar-gradient); }
    .bar-start { stop-color: #8CC8FF; }
    .bar-end { stop-color: #0071E3; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #0D1117; }
      .primary { fill: #F5F5F7; }
      .secondary { fill: #A1A1A6; }
      .bar-start { stop-color: #155FA6; }
      .bar-end { stop-color: #2997FF; }
    }
  </style>
  <rect class="surface" width="1200" height="280" rx="24"/>
  <text class="primary" x="70" y="72"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="30" font-weight="650">Recent GitHub activity</text>
  <text class="secondary" x="70" y="108"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18">Preparing the first automatic refresh · Asia/Tokyo</text>
